<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      {{BRAND_CSS}}
      /* Page margins live in page.pdf() so the running header and footer have
         room; setting them here as well double-counts them. */
      body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
             font-size: 10px; color: #18181b; margin: 0; }
      h1 { text-align: center; font-size: 17px; margin: 0; }
      .period { text-align: center; color: #71717a; margin: 4px 0 20px; }

      section { margin-bottom: 18px; }
      h2 { font-size: 13px; margin: 22px 0 8px; padding-bottom: 4px;
           border-bottom: 1px solid #18181b; break-after: avoid; }
      h3 { font-size: 11px; margin: 12px 0 4px; break-after: avoid; }

      table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
      th, td { padding: 3px 4px; text-align: right; border-bottom: 1px solid #e4e4e7;
               font-variant-numeric: tabular-nums; }
      th { border-bottom: 1px solid #a1a1aa; font-weight: 600;
           font-size: 9px; text-transform: uppercase; letter-spacing: .03em; color: #52525b; }
      th.l, td.l { text-align: left; }
      /* The last row of every table is its total. */
      tbody tr:last-child td { font-weight: 600; border-top: 1px solid #a1a1aa; }

      /* Nine columns do not fit at the body size. */
      table.annexure { font-size: 8px; }

      /* A note should not straddle a page break if it can be avoided. */
      .note { break-inside: avoid; margin-bottom: 14px; }
      .note p { margin: 4px 0; text-align: justify; }

      /* Also emitted as a running footer by page.pdf(), which is what puts it
         on every page. This copy closes the document for anything rendering
         the HTML directly. */
      .statements-footer { margin-top: 24px; padding-top: 10px; font-size: 9px;
                           text-align: center; color: #a1a1aa;
                           border-top: 1px solid #e4e4e7; }
    </style>
  </head>
  <body>
    {{BRAND_HEADER}}
    {{CONTENT}}
  </body>
</html>
